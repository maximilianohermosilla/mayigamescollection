<div class="grid">
    <div class="col-12">
        <div class="card">
            <h4>Mi Perfil</h4>

            <h3 class="my-5 text-yellow-300">Datos personales: </h3>

            @defer{
            <div class="grid">
                <section class="col-12 lg:col-4 rounded-md">
                    <img src="{{usuario.imagen}}" alt="{{usuario.nombre}}" height="200px" class="shadow-5"
                        (error)="onImageError()">
                </section>

                <section *ngIf="usuario" class="col-12 lg:col-8">
                    <p> <strong class="text-green-300">Nombre: </strong>{{usuario.nombre || ""}}</p>
                    <p> <strong class="text-green-300">Usuario: </strong>{{usuario.login || ""}}</p>
                    <p> <strong class="text-green-300">Email: </strong>{{usuario.correo || ""}}</p>
                    <p> <strong class="text-green-300">Perfil: </strong>{{usuario.perfilDescripcion || ""}}</p>

                    <button pButton pRipple label="Editar" class="p-element p-ripple p-button-outlined p-button-warning text-xl my-4" icon="pi pi-pencil"
                    (click)="editarUsuario()"></button>
                </section>
            </div>
            }
        </div>
    </div>
    <p-dialog header="Usuario" [(visible)]="display" [modal]="true" showEffect="fade"
        [style]="{width: '50vw', height: '95vh'}" [breakpoints]="{'960px': '75vw'}">
        <app-form-usuario [element]="usuario" (outputElement)="handleElement($event)"></app-form-usuario>
    </p-dialog>
</div>
