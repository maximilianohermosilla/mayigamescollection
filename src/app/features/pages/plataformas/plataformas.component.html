<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="flex align-items-center mb-3">
                <i class="pi pi-th-large mr-2 text-4xl"></i>
                <div>
                    <h4 class="mb-1">Plataformas</h4>
                    <p class="mt-0 text-600">{{totalJuegos}} juegos en todas las plataformas</p>
                </div>
            </div>
        </div>
    </div>

    @for (p of plataformas; track p.id) {
        <div class="col-12 md:col-4">
            <div class="card">
                <div class="flex align-items-center gap-3">
                    <div class="flex align-items-center justify-content-center bg-gray-800 border-round" style="width: 48px; height: 48px;">
                        @if (p.imagen) {
                            <img [src]="p.imagen" [alt]="p.nombre" width="32" height="32" />
                        } @else {
                            <i class="pi pi-th-large text-white text-xl"></i>
                        }
                    </div>
                    <div class="flex-1">
                        <div class="font-bold text-xl">{{p.nombre}}</div>
                        <div class="text-600">
                            {{p.cantidad}} {{p.cantidad === 1 ? 'juego' : 'juegos'}}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    }
</div>
