<p-fileUpload mode="basic" name="demo[]" accept="image/*" [maxFileSize]="1000000" class="file__upload" [auto]="true"
    (onSelect)="onBasicUpload($event)"></p-fileUpload>

<p-fileUpload name="demo[]" url="./upload.php" (onUpload)="onUpload($event)" [multiple]="true" accept="image/*" [hidden]="true" class="file__upload"
    [maxFileSize]="1000000">
    <ng-template pTemplate="content">
        <ul *ngIf="uploadedFiles.length">
            <li *ngFor="let file of uploadedFiles">{{file.name}} - {{file.size}} bytes</li>
        </ul>
    </ng-template>
</p-fileUpload>
